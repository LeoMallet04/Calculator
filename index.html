<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
    

    <header>
        <h1><center></center></h1>
    </header>

    <main>
        <center>
            <section> 
            
                <div class="calculator">

                    <div class="row">
                        <p class="equal">=</p>
                        <div class="result">
                            <div class="contaAux" id="contaAux"></div>
                            <div class="conta" id="conta"> 
                                <span class="contaSpan" id="contaSpan"></span>
                            </div>
                        </div>
                    </div>
                
                
                    <div class="buttons">
                        <div>
                            <button class="buttonCE" onclick="clearDisplay()">CE</button><button onclick="back()">C</button><button onclick="insertPercent()">%</button><button class="buttonRed" onclick="insertCommand('/')">/</button>
                        </div>
                        
                        <div>
                            <button onclick= "insert(7)">7</button><button onclick= "insert(8)">8</button><button onclick= "insert(9)">9</button><button class="buttonRed" onclick="insertCommand('*')">X</button>
                        </div>

                        <div>
                            <button onclick= "insert(4)">4</button><button onclick= "insert(5)">5</button><button onclick= "insert(6)">6</button><button class="buttonRed" onclick="insertCommand('-')">-</button>
                        </div>

                        <div>
                            <button onclick= "insert(1)">1</button><button onclick= "insert(2)">2</button><button onclick= "insert(3)">3</button><button class="buttonRed" onclick="insertCommand('+')">+</button>
                        </div>

                          
                        <div class="bottomCollum">
                            <button onclick="inverse()">+/-</button><button onclick="insert(0)">0</button><button onclick="comma('.')">,</button><button class="buttonLightRed" onclick="calculator()">=</button>
                        </div>
                    </div>
                    

                </div>

            </section>
        </center>
    </main>

    <script src="javascript.js"></script>
    
</body>
</html>
